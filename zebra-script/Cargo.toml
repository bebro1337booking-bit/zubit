[package]
name = "zebra-script"
version = "12.0.0"
authors.workspace = true
description = "Zebra script verification wrapping zcashd's zcash_script library"
license.workspace = true
repository.workspace = true
edition.workspace = true
rust-version.workspace = true

readme = "../README.md"
homepage.workspace = true
# crates.io is limited to 5 keywords and categories
keywords.workspace = true
# Must be one of <https://crates.io/category_slugs>
categories = ["api-bindings", "cryptography::cryptocurrencies"]

[features]
default = []
# Enable a C++/Rust comparison interpreter that runs both the original C++
# implementation and the Rust implementation, and logs a warning if they don't
# match.
comparison-interpreter = []

[dependencies]
libzcash_script = { workspace = true }
zcash_script = { workspace = true }
zcash_primitives = { workspace = true }
zcash_transparent = { workspace = true }
zebra-chain = { path = "../zebra-chain", version = "13.0.0" }

rand = { workspace = true }
thiserror = { workspace = true }

# Zubit: ML-DSA-44 (FIPS 204) verification for P2PQH outputs.
blake2b_simd = { workspace = true }
fips204 = { version = "0.4.6", default-features = false, features = ["ml-dsa-44"] }

[dev-dependencies]
fips204 = { version = "0.4.6", default-features = false, features = ["ml-dsa-44", "default-rng"] }
hex = { workspace = true }
lazy_static = { workspace = true }
ripemd = { workspace = true }
secp256k1 = { workspace = true }
sha2 = { workspace = true }
zebra-test = { path = "../zebra-test" }

# The tests build transactions with `Transaction::test_v*`, which are gated behind this feature.
zebra-chain = { path = "../zebra-chain", version = "13.0.0", features = ["proptest-impl"] }

[lints]
workspace = true
